<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario Operacional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@600;700&display=swap">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<style>
/* Layout: barra de herramientas arriba; calendario mensual a la izquierda y panel de tipos/filtros a la derecha; una columna en móvil */
:root{
  --bg:#f6f7f5; --surface:#fcfcfb; --fg:#0b0b0b; --fg2:#52514e; --muted:#898781;
  --line:#dcdcd4; --wknd:#efefea; --accent:#1c5cab; --bad:#d03b3b; --warn:#a86a00; --ok:#006300; --done:#00a33c; --on-done:#ffffff;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#1a1a19; --fg:#f0efec; --fg2:#c3c2b7; --muted:#898781;
  --line:#2f2f2c; --wknd:#141413; --accent:#6da7ec; --bad:#e66767; --warn:#e0a020; --ok:#0ca30c; --done:#22c55e; --on-done:#05230f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --fg:#f0efec; --fg2:#c3c2b7; --muted:#898781;
  --line:#2f2f2c; --wknd:#141413; --accent:#6da7ec; --bad:#e66767; --warn:#e0a020; --ok:#0ca30c; --done:#22c55e; --on-done:#05230f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1800px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:15px;margin:0}
.sub{color:var(--fg2);margin:2px 0 0;max-width:80ch}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:0}
input,select,textarea{font-family:var(--f-body);font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
textarea{font-family:var(--f-mono);font-size:12px;width:100%}
input[type=color]{padding:0 2px;width:34px;height:28px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
:is(input,select,textarea,button,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:13px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
button.danger{color:var(--bad)}
button.danger.arm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
button.x{border:none;background:none;color:var(--muted);padding:2px 6px;font-size:17px;line-height:1}
button.x:hover{color:var(--bad)}

header.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:start;justify-content:space-between;margin-bottom:12px}
.util{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.util button:not(.x){border-color:transparent;background:none;color:var(--fg2);padding:4px 9px}
.util button:not(.x):hover{background:var(--surface);border-color:var(--line);color:var(--fg)}
.tbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tabs button{border:none;background:none;color:var(--fg2);border-radius:6px;padding:5px 12px}
.tabs button:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .cnt{display:inline-block;font-size:11px;font-weight:600;min-width:18px;padding:0 5px;margin-left:3px;border-radius:999px;background:color-mix(in srgb,var(--fg) 10%,transparent);text-align:center}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.fbar #q{width:240px;max-width:100%}
.fbar #btnMore{border-color:transparent;background:none;color:var(--fg2)}
.fbar #btnMore:hover{color:var(--fg);text-decoration:underline}
.morep{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start;margin-bottom:12px}
.morep .nx,.morep .types{max-height:280px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav{display:inline-flex;align-items:center;gap:4px}
.nav button{border-color:transparent;background:none;font-size:18px;line-height:1;padding:3px 10px}
.nav button:hover{background:var(--bg)}
.mon{font-family:var(--f-display);font-size:18px;min-width:5.5em;text-align:center;text-transform:capitalize}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--surface)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--surface)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.warn{color:var(--warn)}.sync.bad{color:var(--bad)}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--fg2)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}

/* Calendario mensual */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
/* Lunes a viernes más anchos; sábado y domingo angostos */
.dow,.weeks .wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.62fr))}
@media (max-width:760px){.dow,.weeks .wk{grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.7fr))}}
.dow div{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
.day{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .1s}
.wk .day:last-child{border-right:none}
.day.wknd{background:var(--wknd)}
.day.wknd .chip{font-size:11px;padding:2px 3px}
.day.wknd .chip .n i{font-size:11px}.day.wknd .chip .n b{font-size:10px}
.day.other .dn{color:var(--muted);opacity:.6}
.day.over{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.dn{font-family:var(--f-mono);font-size:12px;color:var(--fg2);padding:1px 4px;align-self:flex-start;border-radius:999px;cursor:pointer;border:none;background:none}
.day.today .dn{background:var(--accent);color:var(--surface);font-weight:600}
.day.today{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.chip{-webkit-user-drag:element;user-select:none;box-sizing:border-box;display:flex;gap:5px;align-items:flex-start;width:100%;min-width:0;cursor:grab;font-size:12px;line-height:1.3;padding:2px 5px 2px 4px;border-radius:4px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--fg);transition:background .15s}
.chip:hover{background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.chip .cb{display:flex;gap:4px;align-items:baseline;flex:1;min-width:0;cursor:inherit;border-radius:3px}
.chip .cb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* Cuadrito para marcar la etapa como hecha */
.ck{all:unset;box-sizing:border-box;flex:none;width:15px;height:15px;margin-top:1px;border-radius:3px;border:1.5px solid color-mix(in srgb,var(--c) 75%,var(--fg));background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1;color:transparent}
.ck:hover{border-color:var(--done)}
.ck:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ck[aria-checked=true]{background:var(--done);border-color:var(--done);color:var(--on-done)}
.chip.done{background:color-mix(in srgb,var(--c) 6%,var(--surface));border-left-color:color-mix(in srgb,var(--c) 35%,var(--surface))}
.chip.done:hover{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.chip.done .n b,.chip.done .n i,.chip.done .t{color:var(--muted)}
.chip .t{font-family:var(--f-mono);font-size:11px;color:var(--fg2);flex:none}
.chip .n{display:flex;flex-direction:column;min-width:0;flex:1}
.chip .n b,.chip .n i{white-space:normal;overflow-wrap:break-word;hyphens:auto;min-width:0}
.chip .n b{font-weight:400;font-size:11px;color:var(--muted)}
.chip .n i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--fg);line-height:1.25;margin-top:1px}
.chip.late,.agrow.late{box-shadow:inset 0 0 0 1.5px var(--warn)}
.latet{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);line-height:1.3}
.chip.out{box-shadow:inset 0 0 0 1.5px var(--bad)}
.chip.out b{color:var(--bad)}
.tagx{display:inline-block;font-size:11px;font-weight:600;color:var(--bad);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.alert{display:flex;flex-direction:column;gap:4px;border:1px solid var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:10px;background:color-mix(in srgb,var(--bad) 8%,var(--surface));font-size:13px}
.alert b{color:var(--bad)}
.alert button{all:unset;cursor:pointer;text-decoration:underline;color:var(--fg)}
.chip.dragging{opacity:.3}
/* Iniciales del operador */
.opb{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:1.35;padding:0 4px;border-radius:3px;background:var(--fg);color:var(--surface);letter-spacing:.03em;vertical-align:1px}
.chip.done .opb{background:var(--muted)}
/* Selector de varios operadores */
.oplist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.oprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.oprow:last-child{border-bottom:0}
.oprow .opb{font-size:12px;padding:1px 7px}
.opk{position:relative;min-width:0}
.opk>summary{list-style:none;cursor:pointer;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 24px 5px 7px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.opk>summary::-webkit-details-marker{display:none}
.opk>summary::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.opk>summary .ph{color:var(--muted)}
.opk[open]>summary{border-color:var(--accent)}
.opk .opm{position:absolute;z-index:30;top:calc(100% + 3px);left:0;min-width:max(100%,150px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.opk .opm label{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap;cursor:pointer}
.opk .opm input{width:auto;flex:none;margin:0;padding:0}
.opk .opm .hint{font-size:11px;margin:2px 0 0}
input[data-done],input[data-sdone],#iAllDone{accent-color:var(--done)}
.more{all:unset;cursor:pointer;font-size:11px;color:var(--fg2);padding:0 5px}
.more:hover{color:var(--fg);text-decoration:underline}
@media (max-width:700px){
  .day{min-height:78px;padding:3px 2px}
  .chip{padding:1px 3px;font-size:10px;gap:3px}
  .ck{width:13px;height:13px;font-size:10px}
  .chip .t,.chip .n i{display:none}
  .dow div{padding:6px 3px;font-size:10px;letter-spacing:.02em}
}

/* Agenda */
.agenda{display:flex;flex-direction:column;gap:14px}
.agpast{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.agpast>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:5px 10px;font-size:13px}
.agpast>summary::-webkit-details-marker{display:none}
.agpast>summary::before{content:'▸';color:var(--muted);font-size:11px}
.agpast[open]>summary::before{content:'▾'}
.agpast .agd{font-family:var(--f-display);font-weight:600;min-width:52px}
.agpast .agbody{padding:4px 8px 8px}
.agpast:not([open]){opacity:.8}
.agenda:has(.agpast){gap:8px}
.agday h3{font-family:var(--f-display);font-size:14px;margin:0 0 6px;display:flex;gap:8px;align-items:center;text-transform:capitalize}
.agrow .agop{width:150px}
.agrow .agop>summary{font-size:12px;padding:3px 22px 3px 7px}
@media (max-width:560px){.agrow{grid-template-columns:auto minmax(0,1fr) auto !important}.agrow .agop{grid-column:2/-1;width:auto}}
/* La identificación de la muestra va en negrita; el nombre general de la actividad, más suave */
.agrow .tx b .lb,.chip .n b .lb{font-weight:700;color:var(--fg)}
.chip.done .n b .lb{color:var(--muted)}
.agrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;background:var(--surface);margin-bottom:5px;cursor:pointer}
.agrow:hover{border-color:var(--muted);border-left-color:var(--c)}
.agrow .tm{font-family:var(--f-mono);font-size:12px;color:var(--fg2)}
.agrow .tx{min-width:0}
.agrow .tx b{font-weight:400;color:var(--fg2)}
.agrow .tx div{font-size:12px;color:var(--fg2);overflow-wrap:anywhere}
.agrow .stp{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.agrow.done{background:color-mix(in srgb,var(--c) 5%,var(--surface));border-left-color:color-mix(in srgb,var(--c) 35%,var(--surface))}
.agrow.done .tx b{color:var(--muted)}
.tagw{font-size:11px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:0 7px;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.empty{padding:28px;text-align:center;color:var(--fg2)}

/* Panel lateral */
.types{display:flex;flex-direction:column;gap:2px}
.trow{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:13px;cursor:pointer}
.trow .sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.trow .nm{flex:1;min-width:0}
.trow .ct{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.trow.off .nm{color:var(--muted);text-decoration:line-through}
.nx{display:flex;flex-direction:column;gap:6px}
.nxr{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;font-size:12px;cursor:pointer}
.nxr .d{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px}
.nxr .w{font-family:var(--f-mono);font-size:11px;color:var(--fg2)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg2);cursor:pointer}
.chk input,.fld .chk input{margin-top:2px;flex:none;width:15px}

/* Modales */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:start;gap:12px}
.mh h2{font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select,.fld textarea{width:100%}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.stages{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:22px minmax(0,1fr) 78px auto auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.st .i{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
.st .nm{font-size:13px;min-width:0}
.st .nm input{width:100%}
.st .gap{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.st input[type=datetime-local]{font-family:var(--f-mono);font-size:12px}
@media (max-width:560px){.st{grid-template-columns:22px minmax(0,1fr) auto}.st .dt,.st .sop{grid-column:2/-1}}
.pv{display:flex;flex-direction:column;gap:4px;font-size:13px}
.pvr{display:grid;grid-template-columns:18px 150px minmax(0,1fr);gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.pvr:hover{background:var(--bg)}
.pvr.off{color:var(--muted)}
.pvr input{width:15px}
.pv .w{font-family:var(--f-mono);font-size:12px;color:var(--fg2)}
.mf{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.mf .bar{gap:8px}
.tblock{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.thead{display:flex;gap:8px;align-items:center}
.thead input[type=text]{flex:1;font-weight:600}
.tst{display:grid;grid-template-columns:minmax(0,1fr) 64px 76px 210px auto;gap:6px;align-items:center}
.tst input[type=number]{font-family:var(--f-mono)}
.tst .first{font-size:12px;color:var(--muted);grid-column:2/4}
@media (max-width:640px){.tst{grid-template-columns:minmax(0,1fr) 60px 70px auto}.tst select[data-ts$="|wk"]{grid-column:1/-2}}
.msg{font-size:12px;color:var(--bad)}
.bk{font-size:12px!important;color:var(--muted)}
.bk.dirty{color:var(--warn)}.bk.dirty::before{content:"● ";}
.donecard{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.donecard:hover{border-color:var(--muted);border-left-color:var(--c)}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px}
.okp{font-size:12px;font-weight:600;color:var(--ok)}
.dg{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13px}
.dg .w{font-family:var(--f-mono);font-size:12px;color:var(--fg2)}
.autol{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.autor{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--line);font-size:13px}
.autor:last-child{border-bottom:0}
.autor span:first-child{font-family:var(--f-mono);font-size:12px}
.autor button{font-size:12px;padding:2px 9px}
.bkbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
/* Envío a procesamiento */
.envh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}

.est.horno{color:#c2570c}
.est.drenaje{color:#1a7f37}
.est.lavado{color:#0b78a8}
.est.prog{color:#7c4dbd}
.est.listo{color:#fff;background:var(--bad);border-color:var(--bad)}

table.env tr.f-horno td{background:color-mix(in srgb,#f08a24 22%,var(--surface))}
table.env tr.f-dre td{background:color-mix(in srgb,#3fb950 18%,var(--surface))}
table.env tr.f-lav td{background:color-mix(in srgb,#38b6e8 18%,var(--surface))}
table.env tr.f-prog td{background:color-mix(in srgb,#a77ee0 18%,var(--surface))}

.envleg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.envleg .est{font-size:11px}
.est.proc{color:var(--warn)}
.est.ok{color:var(--muted)}
table.env select.envcc{min-width:70px;padding-right:2px}
table.env select.envan{font-size:12px;padding-left:5px;padding-right:2px}
table.env{border-collapse:collapse;width:100%;min-width:1060px;font-size:13px}
table.env th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.env td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.env td input,table.env td select,table.env td textarea{width:100%}
table.env td textarea.envm{resize:none;overflow:hidden;font-weight:600;line-height:1.35;min-height:30px;white-space:pre-wrap;overflow-wrap:anywhere}

.envtabs{align-self:flex-start}

table.env tr.sent td{background:color-mix(in srgb,var(--done) 9%,var(--surface))}

  if (w.length>1 && tw.length>=5 && nrm(w[0]).slice(0,6)===tw.slice(0,6)) return w.slice(1).join(' ');   // «Sulfataciones 29a la 36» → «29a la 36»
  return lb;
}
const shortStage = n => String(n||'').replace(/\s*\([^)]*\)/g,'').replace(/\s+de(l)? columnas?\b/gi,'').replace(/\+\s*ingreso a /gi,'+ ').replace(/\s{2,}/g,' ').trim();
const lblHTML = e => { const l = shortLabel(e); return l ? ` <span class="lb">· ${esc(l)}</span>` : ''; };
function chip(e){

    title="${esc(e.tn)} · ${esc(e.it.label)}${e.op?' · Operador: '+esc(e.op):''}&#10;${esc(e.s.name)} (${e.i+1}/${e.it.stages.length})&#10;${short(e.d)}${e.s.done?'&#10;✓ Hecha':''}${out?'&#10;⚠ Fuera de rango: cae fin de semana':''}">

function renderAgenda(){

        ${opPick(`ag-op-${e.it.id}-${e.i}${e.late?'-l':''}`, e.s.op||'', e.it.op ? e.it.op+' (resp.)' : 'Asignar operador', `data-agop="${e.it.id}|${e.i}"`).replace('class="opk"', 'class="opk agop"')}

    return `<section class="agday"><h3>${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]} ${d.getDate()} de ${MONL[d.getMonth()]} ${k===todayK?'<span class="tagw" style="color:var(--accent)">Hoy</span>':''} ${isWk(d)?'<span class="tagw">Fin de semana</span>':''}<button type="button" data-print="${k}" style="margin-left:auto;font-size:12px;padding:2px 9px">🖨 Imprimir día</button></h3>

    : '<p class="hint">No hay etapas pendientes.</p>';

/* ---------- Mover etapas ---------- */
function shiftStage(it, idx, minutes, follow){
  let acc = 0; const moved = [];
  it.stages.forEach((s,i)=>{
    if (i===idx || (follow && i>idx)){
      const d=parse(s.at); d.setMinutes(d.getMinutes()+minutes+acc);
      if (ruleOf(s)==='shift' && isWk(d)){ const n=nextWeekday(d); if (follow) acc += Math.round((n-d)/6e4); moved.push(s.name); s.at=fmt(n); }
      else s.at=fmt(d);
    }
  });
  if (moved.length) setTimeout(()=>toast(`${moved.join(', ')}: cae fin de semana, se corrió al siguiente día hábil`), 2700);
  return moved;
}
const tagOut = d => `<span class="tagx">⚠ Fuera de rango: cae ${DAYN[d.getDay()]}</span>`;
let drag = null;
document.addEventListener('dragstart', e=>{
  const c = e.target.closest?.('.chip'); if (!c) return;
  drag = {item:c.dataset.item, stage:+c.dataset.stage}; c.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', drag.item); e.dataTransfer.effectAllowed='move'; } catch(_){}
});
document.addEventListener('dragend', ()=>{ drag=null; document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')); });
document.addEventListener('dragover', e=>{ const d=e.target.closest?.('.day'); if (d && drag){ e.preventDefault(); document.querySelectorAll('.over').forEach(x=>x!==d&&x.classList.remove('over')); d.classList.add('over'); }});
document.addEventListener('drop', e=>{
  const d = e.target.closest?.('.day'); if (!d || !drag) return; e.preventDefault();
  const it = itemOf(drag.item); if (!it) return;
  const s = it.stages[drag.stage], cur = parse(s.at), tgt = parse(d.dataset.day);
  tgt.setHours(cur.getHours(), cur.getMinutes());
  const days = Math.round((tgt - cur)/864e5); if (!days) return;
  const follow = $('follow').checked;
  shiftStage(it, drag.stage, Math.round((tgt-cur)/6e4), follow);
  if (it.sample) delete it.sample;
  render();
  toast(`${s.name} movida al ${short(tgt)}${follow && drag.stage<it.stages.length-1 ? ' (y las siguientes)' : ''}`);
});

/* ---------- Modales ---------- */
function openModal(html, wide){ const m=$('modal'); m.className='modal'+(wide?' wide':''); m.innerHTML=html; $('ov').hidden=false; const f=m.querySelector('[autofocus]')||m.querySelector('input,select,button'); f&&f.focus(); }
function closeModal(){ $('ov').hidden=true; $('modal').innerHTML=''; render(); }
$('ov').addEventListener('mousedown', e=>{ if (e.target===$('ov')) closeModal(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !$('ov').hidden) closeModal(); });
const head = (t,sub) => `<div class="mh"><div><h2>${t}</h2>${sub?`<p class="hint" style="margin-top:2px">${sub}</p>`:''}</div><button class="x" type="button" data-close aria-label="Cerrar">×</button></div>`;

function fieldsHtml(t, vals, pre){
  if (!t.fields || !t.fields.length) return '';
  return `<div class="row2">${t.fields.map(f=>{
    const id = pre+f.key, v = (vals||{})[f.key] ?? '';
    if (f.type==='check') return `<div class="fld" style="grid-column:1/-1"><label class="chk" style="color:var(--fg)"><input type="checkbox" id="${id}" data-f="${f.key}" ${v?'checked':''}> <b>${esc(f.label)}</b></label></div>`;
    const inp = f.type==='select'
      ? `<select id="${id}" data-f="${f.key}">${(!v || f.options.includes(v) ? f.options : f.options.concat(v)).map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'—')}</option>`).join('')}</select>`
      : `<input id="${id}" data-f="${f.key}" type="${f.type==='date'?'date':'text'}" value="${esc(v)}">`;
    return `<div class="fld"><label class="lbl" for="${id}">${esc(f.label)}</label>${inp}</div>`;
  }).join('')}</div>`;
}
function selStages(t, st, sel){ return sel.size ? runChain(t, st, Math.min(...sel), sel) : []; }
function newModal(preDay){

  openModal(`${head('Programar actividad','Elige el tipo, marca las etapas que quieres agregar y la fecha de la primera etapa marcada. Las demás se calculan solas.')}

      <div class="pv" id="nPrev"></div></div>
    <div class="mf"><span class="hint">Después puedes ajustar cada fecha por separado.</span><div class="bar"><button type="button" data-close>Cancelar</button><button class="pri" type="button" id="nSave">Programar</button></div></div>`);
  if (!t0){ $('nPrev').innerHTML='<p class="msg">Primero crea un tipo de actividad.</p>'; return; }
  let sel = new Set();
  const upd = ()=>{
    const t = typeOf($('nType').value), st = $('nStart').value ? $('nStart').value+'T09:00' : '';
    if (upd.tid !== t.id){ upd.tid = t.id; sel = new Set(t.stages.map((_,i)=>i)); $('nFields').innerHTML = fieldsHtml(t, {}, 'nf-'); $('nLabel').placeholder = t.labelHint || 'Ej: COL 281 OFF 2'; }
    const first = Math.min(...sel);
    $('nStartLbl').textContent = sel.size ? `Fecha de: ${t.stages[first].name}` : 'Fecha';
    $('nSave').disabled = !sel.size || !st;
    if (!st){ $('nPrev').innerHTML='<p class="msg">Indica la fecha.</p>'; return; }
    const calc = {}; selStages(t, st, sel).forEach(s=>calc[s.i]=s);
    $('nPrev').innerHTML = t.stages.map((s,i)=>{ const c=calc[i], d=c?parse(c.at):null; return `<label class="pvr${c?'':' off'}">

      + (Object.values(calc).some(outOfRange) ? '<p class="msg">⚠ Hay etapas que caen fin de semana y quedan fuera de rango de lo establecido. Cambia la fecha de inicio para que caigan en día hábil.</p>' : '')

  };
  ['nType','nStart'].forEach(id=>$(id).addEventListener('input',upd));
  $('nPrev').addEventListener('change', e=>{ const x=e.target; if (x.dataset.np===undefined) return; x.checked ? sel.add(+x.dataset.np) : sel.delete(+x.dataset.np); upd(); });
  $('nAll').onclick = ()=>{ sel = new Set(typeOf($('nType').value).stages.map((_,i)=>i)); upd(); };
  $('nNone').onclick = ()=>{ sel = new Set(); upd(); };

function itemModal(id){

      ${it.stages.length>1?`<button class="x" type="button" data-srm="${i}" aria-label="Quitar etapa">×</button>`:'<span></span>'}</div>`; }).join('');
  };
  drawSt();

/* ---------- Imprimible por día ---------- */
function dayDoc(key){
  const d = parse(key), DN = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const evs = [];
  const t0 = new Date(); t0.setHours(0,0,0,0); const isRoll = key===dkey(lateDay());
  state.items.forEach(it=>{ const t = typeOf(it.typeId); it.stages.forEach((s,i)=>{ const x = parse(s.at), op = opOf(it,s); if (!opMatch(op)) return;
    const late = !s.done && !it.sample && x < t0;
    if (late){ if (isRoll) evs.push({it,t,s,i,d:x,op,tn:phaseName(t,s),late:x}); }
    else if (dkey(x)===key) evs.push({it,t,s,i,d:x,op,tn:phaseName(t,s)}); }); });
  evs.sort((a,b)=>(b.late?1:0)-(a.late?1:0) || a.d-b.d);
  const env = (state.envios||[]).filter(e=>!e.del && (e.fecha||e.horno)===key);
  const rows = evs.map(e=>`<tr><td class="c"><b>${esc(e.op)}</b></td><td><span class="sw" style="background:${e.t.color}"></span>${esc(e.tn)}</td><td><b>${esc(e.it.label)}</b></td>
    <td>${e.late?`<b>⏰ ATRASADA (era del ${fmtD(e.late)})</b><br>`:''}${esc(e.s.name)} <span class="m">(${e.i+1}/${e.it.stages.length})</span></td><td class="c">${e.s.done?'☑':'☐'}</td>
    <td>${fieldTxt(e.it).map(esc).join('<br>')}${e.it.notes?`${fieldTxt(e.it).length?'<br>':''}Notas: ${esc(e.it.notes)}`:''}</td></tr>`).join('');
  const erows = env.map(e=>`<tr><td>${esc(e.cc||'')}</td><td><b>${esc(e.muestra||'')}</b></td><td>${esc(e.tipo||'Ripio')}</td><td class="c">${esc(e.cond||'')}</td><td>${esc(e.analisis||'')}</td><td class="c">${e.envProc?'☑':'☐'}</td><td class="c">${e.envAna?'☑':'☐'}</td></tr>`).join('');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Actividades ${fmtD(d)}</title><style>
    @page{size:A4 landscape;margin:12mm}
    body{font:12px Arial,Helvetica,sans-serif;color:#111;margin:0}
    h1{font-size:18px;margin:0 0 2px} h2{font-size:14px;margin:18px 0 6px}
    .sub{color:#555;margin:0 0 10px}
    table{border-collapse:collapse;width:100%} th,td{border:1px solid #999;padding:5px 6px;vertical-align:top;text-align:left}
    th{background:#1f4e78;color:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tr{page-break-inside:avoid} .c{text-align:center;white-space:nowrap} .m{color:#666}
    .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .firma{margin-top:28px;display:flex;gap:60px} .firma div{border-top:1px solid #333;padding-top:4px;min-width:220px}
  </style></head><body>
    <h1>Calendario Operacional · ${DN[d.getDay()]} ${fmtD(d)}${ui.op?` · Operador: ${ui.op==='-'?'sin asignar':esc(ui.op)}`:''}</h1>
    <p class="sub">${evs.length} etapa${evs.length===1?'':'s'} programada${evs.length===1?'':'s'}${env.length?` · ${env.length} envío${env.length===1?'':'s'} a procesamiento`:''} · impreso el ${fmtD(new Date())} ${hm(new Date())}</p>
    ${evs.length ? `<table><thead><tr><th style="width:60px">Operador</th><th style="width:18%">Actividad</th><th style="width:12%">Muestra / columna</th><th>Etapa</th><th style="width:45px">Hecha</th><th style="width:28%">Datos</th></tr></thead><tbody>${rows}</tbody></table>` : '<p>No hay etapas programadas este día.</p>'}
    ${env.length ? `<h2>Envío a procesamiento</h2><table><thead><tr><th style="width:50px">CC</th><th>ID muestra</th><th style="width:70px">Tipo</th><th style="width:85px">Condiciones</th><th>Análisis</th><th style="width:85px">Enviado a procesamiento</th><th style="width:70px">Enviado a análisis</th></tr></thead><tbody>${erows}</tbody></table>` : ''}
    <div class="firma"><div>Responsable</div><div>Revisado por</div></div>
  </body></html>`;
}
async function printDay(key){
  const html = dayDoc(key);
  if (typeof sync!=='undefined' && sync.db){   // en el calendario compartido no se puede abrir la impresión: se descarga para imprimir
    if (await offerFile(`Actividades_${key}.html`, html)) toast('Abre el archivo descargado y pulsa Ctrl+P para imprimir');
    return;
  }
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f); const doc = f.contentDocument; doc.open(); doc.write(html); doc.close();
  setTimeout(()=>{ try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){ toast('No se pudo abrir la impresión'); } setTimeout(()=>f.remove(), 60000); }, 300);
}

function typesModal(){
  openModal(`${head('Tipos de actividad','Define las etapas de cada tipo y cuánto tiempo pasa desde la etapa anterior. Los cambios aplican a lo que programes de ahora en adelante.')}
    <div id="tList" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="mf"><div class="bar"><button type="button" id="tAdd">+ Nuevo tipo</button><button type="button" id="tReset">Restaurar tipos originales</button></div><button class="pri" type="button" data-close>Listo</button></div>`, true);
  const draw = ()=>{
    $('tList').innerHTML = state.types.map((t,ti)=>`<div class="tblock" style="--c:${t.color}">
      <div class="thead"><input type="color" id="tc${ti}" value="${t.color}" data-tc="${ti}" aria-label="Color"><input type="text" id="tn${ti}" value="${esc(t.name)}" data-tn="${ti}" aria-label="Nombre del tipo"><button class="x" type="button" data-tdel="${ti}" aria-label="Eliminar tipo">×</button></div>
      <div class="msg" id="tm${ti}" hidden></div>
      ${t.stages.map((s,si)=>`<div class="tst">
        <input type="text" id="ts${ti}-${si}" value="${esc(s.name)}" data-ts="${ti}|${si}|name" aria-label="Etapa">
        ${si===0?'<span class="first">Fecha de inicio</span>':`<input type="number" id="tsa${ti}-${si}" min="0" step="1" value="${s.after}" data-ts="${ti}|${si}|after" aria-label="Tiempo desde la etapa anterior">
        <select id="tsu${ti}-${si}" data-ts="${ti}|${si}|unit" aria-label="Unidad"><option value="h" ${s.unit==='h'?'selected':''}>horas</option><option value="d" ${s.unit==='d'?'selected':''}>días</option></select>`}
        <select id="tsw${ti}-${si}" data-ts="${ti}|${si}|wk" aria-label="Si cae fin de semana"><option value="warn" ${ruleOf(s)==='warn'?'selected':''} ${SHIFT_RE.test(s.name)?'disabled':''}>Fin de semana: avisar</option><option value="shift" ${ruleOf(s)==='shift'?'selected':''}>Fin de semana: correr a día hábil</option></select>
        <button class="x" type="button" data-sdel="${ti}|${si}" aria-label="Quitar etapa" ${t.stages.length<2?'disabled':''}>×</button></div>`).join('')}
      <div><button type="button" data-sadd="${ti}">+ Etapa</button></div></div>`).join('');
  };
  draw();
  const L = $('tList');
  L.addEventListener('input', e=>{
    const x=e.target;
    if (x.dataset.tc!==undefined){ state.types[+x.dataset.tc].color=x.value; x.closest('.tblock').style.setProperty('--c',x.value); }
    if (x.dataset.tn!==undefined) state.types[+x.dataset.tn].name=x.value;
    if (x.dataset.ts){ const [ti,si,k]=x.dataset.ts.split('|'); state.types[+ti].stages[+si][k] = k==='after' ? Math.max(0,+x.value||0) : x.value; }
    save();
  });
  L.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    if (b.dataset.sadd!==undefined){ state.types[+b.dataset.sadd].stages.push({name:'Nueva etapa',after:24,unit:'h'}); draw(); }
    if (b.dataset.sdel){ const [ti,si]=b.dataset.sdel.split('|').map(Number); state.types[ti].stages.splice(si,1); draw(); }
    if (b.dataset.tdel!==undefined){
      const ti=+b.dataset.tdel, t=state.types[ti], n=state.items.filter(i=>i.typeId===t.id).length;
      if (n){ const m=$('tm'+ti); m.hidden=false; m.textContent=`Tiene ${n} actividad${n>1?'es':''} programada${n>1?'s':''}. Elimínalas antes de borrar este tipo.`; return; }
      state.types.splice(ti,1); draw();
    }
    save();
  });
  $('tAdd').onclick = ()=>{ state.types.push({id:uid(), name:'Nueva actividad', color:PALETTE[state.types.length%PALETTE.length], stages:[{name:'Inicio',after:0,unit:'h'},{name:'Término',after:24,unit:'h'}]}); draw(); save(); const n=$('tn'+(state.types.length-1)); n.focus(); n.select(); };
  $('tReset').onclick = e=>{
    const b=e.currentTarget;
    if (!b.classList.contains('arm')){ b.classList.add('arm','danger'); b.textContent='Confirmar: restaurar'; return; }
    const used = new Set(state.items.map(i=>i.typeId));
    const custom = state.types.filter(t=>used.has(t.id) && !DEFAULT_TYPES.some(d=>d.id===t.id));
    state.types = JSON.parse(JSON.stringify(DEFAULT_TYPES)).concat(custom);
    b.classList.remove('arm','danger'); b.textContent='Restaurar tipos originales'; draw(); save(); toast('Tipos originales restaurados');
  };
}

/* ---------- Trazabilidad de eliminadas ---------- */
function logDeleted(it, why){
  if (it.sample) return;
  (state.deleted ||= []).push({...JSON.parse(JSON.stringify(it)), did:uid(), typeName:typeOf(it.typeId).name, deletedAt:new Date().toISOString(), reason:why||''});
}
/* ---------- Completadas ---------- */
const isDone = it => it.stages.length>0 && it.stages.every(s=>s.done);
function syncDone(it){ if (isDone(it)) it.completedAt ||= new Date().toISOString(); else delete it.completedAt; }
function fieldTxt(it){ const t=typeOf(it.typeId); return (t.fields||[]).filter(f=>it.fields && it.fields[f.key]).map(f=>`${f.label}: ${f.type==='date'?fmtD(parse(it.fields[f.key])):it.fields[f.key]}`); }
const fmtD = d => `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
function renderDone(){
  const list = state.items.filter(i=>isDone(i) && visible(i)).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  if (!list.length){ $('main').innerHTML = '<div class="panel empty">Todavía no hay actividades completadas. Al marcar todas las etapas de una actividad como hechas, aparece aquí con todo lo que ingresaste.</div>'; return; }
  $('main').innerHTML = '<div class="agenda">' + list.map(it=>{
    const t = typeOf(it.typeId), c = it.completedAt ? new Date(it.completedAt) : null;
    return `<div class="donecard" style="--c:${t.color}" data-open="${it.id}">
      <div class="dh"><b>${esc(t.name)} · ${esc(it.label)}</b><span class="okp">✓ Completada${c?` el ${fmtD(c)} ${hm(c)}`:''}</span></div>
      <div class="dg">${it.stages.map((s,i)=>`<span class="w">${short(parse(s.at))}</span><span>${i+1}. ${esc(s.name)}</span>`).join('')}</div>
      ${fieldTxt(it).length||it.notes?`<div class="hint" style="color:var(--fg2)">${fieldTxt(it).map(esc).join(' · ')}${it.notes?`${fieldTxt(it).length?' · ':''}Notas: ${esc(it.notes)}`:''}</div>`:''}
    </div>`;
  }).join('') + '</div>';
}

/* ---------- Envío a procesamiento ---------- */
/* Cada lavado y descarga de columna agrega su ripio con la fecha de salida del horno; los minerales se agregan a mano */
const ENV_CC = ['RD','MS','IF','SG'], ENV_SN = ['Si','No'];
const envCC = cc => /^MS/.test(cc||'') ? 'MS' : (cc||'');   // en envíos, Caserones y Lomas Bayas van como MS
/* Textos cortos para los análisis (el valor guardado es el nombre completo) */
const AN_BASE = 'Cu, CuSec, Fe, Fe Soluble', AN_FULL = AN_BASE+', Mo, Ag, Au, Co, Ni', AN_MIN = AN_FULL+', Consumo de ácido';
const AN_SHORT = {[AN_BASE]:'Cu-Fe (4)', [AN_FULL]:'+Mo-Au (9)', [AN_MIN]:'+Ácido (10)', 'N/A':'N/A'};
/* Análisis según el envío: minerales = todo + consumo de ácido; MS = todo; RD, IF y SG = Cu, CuSec, Fe, Fe soluble.
   Si se marca N/A o se elige otro a mano, se respeta. */
const anAuto = e => e.tipo==='Mineral' ? AN_MIN : e.cc==='MS' ? AN_FULL : (e.cc ? AN_BASE : '');
/* Un envío está «listo» (pasa al historial) cuando tiene los dos tickets, o el de procesamiento y el análisis dice N/A */
const isNA = v => /^(n\s*\/?\s*a|no aplica|no)$/i.test(String(v||'').trim());
const envDone = e => !!e.envProc && (!!e.envAna || isNA(e.analisis));
const ENV_AN = ['Cu, CuSec, Fe, Fe Soluble','Cu, CuSec, Fe, Fe Soluble, Mo, Ag, Au, Co, Ni','Cu, CuSec, Fe, Fe Soluble, Mo, Ag, Au, Co, Ni, Consumo de ácido','N/A'];
const ripioName = l => { l = String(l||'').trim(); return /^\d/.test(l) ? 'RIPIO '+l : l; };
const ovenStage = it => it.stages.find(s=>/sacar|salida del horno|pesaje/i.test(s.name));
function syncEnvios(){
  state.envios ||= [];
  state.items.filter(i=>i.typeId==='desc' && !i.sample).forEach(it=>{
    const s = ovenStage(it); if (!s) return;
    /* La fecha de envío la pone la usuaria; la de salida del horno viene del calendario */
    const horno = s.at.slice(0,10), an = (it.fields||{}).analisis || '', cc = envCC(ccOf(it));
    /* «COL 310-312» son dos columnas distintas: un envío por columna (RIPIO 310 y RIPIO 312) */
    const nums = (String(it.label||'').match(/\d{1,4}/g)||[]), multi = nums.length > 1;
    const parts = nums.length ? nums.map(n=>({id: multi ? `r-${it.id}-${n}` : 'r-'+it.id, muestra:'RIPIO '+n})) : [{id:'r-'+it.id, muestra:ripioName(it.label)}];
    const old = multi ? state.envios.find(x=>x.id==='r-'+it.id) : null;   // envío antiguo con las columnas juntas
    parts.forEach(p=>{
      let e = state.envios.find(x=>x.id===p.id);
      if (!e){
        e = {id:p.id, from:it.id, tipo:'Ripio', fecha:'', horno, cc, muestra:p.muestra, cond:'', recep:'', analisis:an};
        if (old){ ['cond','recep','envProc','envAna','del','doneAt'].forEach(k=>{ if (old[k]) e[k] = old[k]; });
          if (old.edF){ e.fecha = old.fecha; e.edF = 1; } if (old.edA){ e.analisis = old.analisis; e.edA = 1; } if (old.cc){ e.cc = old.cc; e.edC = 1; } }
        state.envios.push(e); return;
      }
      if (!e.edF && e.fecha && !e.horno && !e.envProc) e.fecha = '';   // versión anterior: la fecha se ponía sola
      e.horno = horno;
      if (!e.edM && e.muestra!==p.muestra) e.muestra = p.muestra;
      if (!e.edA && e.analisis!==an) e.analisis = an;
      if (!e.edC && cc && e.cc!==cc) e.cc = cc;
      if (/^MS-/.test(e.cc||'')) e.cc = 'MS';
    });
    if (old) state.envios = state.envios.filter(x=>x!==old);
  });
  state.envios.forEach(e=>{ if (!e.del && !e.edA && !isNA(e.analisis)){ const a = anAuto(e); if (a && e.analisis!==a) e.analisis = a; } });
  state.envios.forEach(e=>{ if (envDone(e) && !e.doneAt) e.doneAt = new Date().toISOString(); if (!envDone(e) && e.doneAt) delete e.doneAt; });
  // si se elimina la actividad y el envío no tiene datos propios, sale de la lista
  if (state.envios.some(e=>e.from && !itemOf(e.from) && !e.cc && !e.cond && !e.recep))
    state.envios = state.envios.filter(e=>!e.from || itemOf(e.from) || e.cc || e.cond || e.recep);
}
const envOpt = (list, v) => ['', ...list, ...(v && !list.includes(v) ? [v] : [])].map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'—')}</option>`).join('');
function renderEnvios(){
  const today = dkey(new Date());
  const hist = ui.envTab==='hist';
  const all = state.envios.filter(e=>!e.del && (!ui.q || ((e.muestra||'')+' '+(e.cc||'')+' '+(CC_NAME[e.cc]||'')).toLowerCase().includes(ui.q)));
  const nPend = all.filter(e=>!envDone(e)).length, nHist = all.length - nPend;
  const list = all.filter(e=>hist ? envDone(e) : !envDone(e))
    .sort((a,b)=>{ const fa = a.fecha||a.horno||'', fb = b.fecha||b.horno||'';
      return (hist ? fb.localeCompare(fa) : fa.localeCompare(fb)) || (a.muestra||'').localeCompare(b.muestra||'', 'es', {numeric:true}); });
  /* Estado de los ripios: en el horno hasta el día de salida; desde ese día, listo para envío */
  /* Etapa real del ripio según el calendario de su columna: programado → lavado → drenaje → horno → listo */
  const fase = e => {
    if (hist) return {k:'sent'};
    if (e.envProc) return {k:'proc'};
    const it = e.from && itemOf(e.from);
    if (!it){ return e.horno && e.horno > today ? {k:'horno', hasta:e.horno} : e.horno ? {k:'listo'} : !e.fecha && !e.envAna ? {k:'sinf'} : {k:''}; }
    const st = it.stages.slice().sort((a,b)=>a.at.localeCompare(b.at));
    const at = re => (st.find(s=>re.test(s.name))||{}).at;
    const sal = (at(/salida|sacar|pesaje/i)||e.horno||'').slice(0,10), des = (at(/descarga|secado/i)||'').slice(0,10),
          dre = (at(/drenaje/i)||'').slice(0,10), lav = (at(/lavado/i)||'').slice(0,10);
    if (sal && today >= sal) return {k:'listo'};
    if (des && today >= des) return {k:'horno', hasta:sal};
    if (dre && today >= dre) return {k:'drenaje', hasta:des};
    if (lav && today >= lav) return {k:'lavado', hasta:dre};
    return {k:'prog', desde:lav||dre||des};
  };
  const FASE_TXT = {sinf:'Listo para envío', lavado:'En lavado', drenaje:'En drenaje', horno:'En el horno', listo:'Listo para envío', proc:'Falta análisis', sent:'Enviado', prog:'Programado'};
  const FASE_SUB = {lavado:'drenaje desde', drenaje:'descarga el', horno:'sale', prog:'inicia'};
  /* Orden de los pendientes: falta análisis, listos para envío sin fecha ni ticket (rojo), en el horno, en drenaje, en lavado, programados y el resto */
  const RANK = {proc:0, sinf:1, listo:1, horno:3, drenaje:4, lavado:5, prog:6};
  if (!hist) list.sort((a,b)=>{ const ra = RANK[fase(a).k] ?? 7, rb = RANK[fase(b).k] ?? 7;
    return ra-rb || (a.horno||a.fecha||'').localeCompare(b.horno||b.fecha||'') || (a.muestra||'').localeCompare(b.muestra||'', 'es', {numeric:true}); });
  const estado = (e, f=fase(e)) => !f.k ? '' : `<span class="est ${f.k}">${FASE_TXT[f.k]}</span>${(f.hasta||f.desde) && FASE_SUB[f.k] ? `<span class="hint">${FASE_SUB[f.k]} ${fmtD(parse(f.hasta||f.desde))}</span>` : ''}`;
  $('main').innerHTML = `<div class="panel">
    <div class="envh"><div><h2>${hist ? 'Historial de envíos' : 'Envío a procesamiento'}</h2></div>
      <div class="bar"><button class="pri" id="eAdd" type="button">+ Agregar mineral</button></div></div>
    <div class="seg envtabs" role="group" aria-label="Lista de envíos"><button type="button" data-envtab="pend" aria-pressed="${!hist}">Pendientes (${nPend})</button><button type="button" data-envtab="hist" aria-pressed="${hist}">Historial de enviados (${nHist})</button></div>
    ${hist ? '' : '<div class="envleg"><span class="hint">Orden:</span><span class="est proc">Falta análisis</span><span class="est listo">Listo para envío (sin fecha ni ticket)</span><span class="est horno">En el horno</span><span class="est drenaje">En drenaje</span><span class="est lavado">En lavado</span><span class="est prog">Programado</span></div>'}
    ${list.length ? `<div class="tblw"><table class="env"><thead><tr><th style="width:130px">Fecha envío</th><th style="width:88px">CC</th><th style="min-width:180px">ID muestra</th><th style="width:130px">Fecha recepción</th><th style="width:105px" title="Se pone solo: RD, IF y SG = Cu-Fe (4): Cu, CuSec, Fe, Fe Soluble · MS = +Mo-Au (9): además Mo, Ag, Au, Co, Ni · Minerales = +Ácido (10): los 9 más consumo de ácido · N/A se elige a mano">Análisis</th><th style="width:58px;text-align:center" title="Enviado a procesamiento">Env. proc.</th><th style="width:58px;text-align:center" title="Enviado a análisis">Env. aná.</th><th style="width:130px">Estado</th><th style="width:40px"></th></tr></thead><tbody>
    ${list.map(e=>`<tr data-env="${e.id}" class="${{sent:'sent', sinf:'f-sinf', horno:'f-horno', listo:'f-sinf', lavado:'f-lav', drenaje:'f-dre', prog:'f-prog'}[fase(e).k]||''}" style="--c:${e.tipo==='Mineral'?'#1c5cab':'#b5543c'}">
      <td><input type="date" data-ef="fecha" value="${esc(e.fecha||'')}" aria-label="Fecha envío"></td>
      <td><select data-ef="cc" aria-label="Centro de costo" class="envcc" style="--cc:${CC_COLOR[e.cc]||CC_COLOR['']}">${envOpt(ENV_CC, e.cc)}</select></td>
      <td><textarea data-ef="muestra" rows="1" class="envm" aria-label="ID muestra" placeholder="Ej: M-21">${esc(e.muestra)}</textarea><span class="tipo${e.tipo==='Mineral'?' min':''}">${esc(e.tipo||'Ripio')}</span></td>
      <td><input type="date" data-ef="recep" value="${esc(e.recep)}" aria-label="Fecha recepción"></td>
      <td><select data-ef="analisis" class="envan" aria-label="Análisis" title="${esc(e.analisis||'')}">${['', ...ENV_AN, ...(e.analisis && !ENV_AN.includes(e.analisis) ? [e.analisis] : [])].map(o=>`<option value="${esc(o)}" ${o===e.analisis?'selected':''} title="${esc(o)}">${esc(o ? (AN_SHORT[o]||o) : '—')}</option>`).join('')}</select></td>

function normCC(v){
  const s = String(v||'').trim().toUpperCase().replace(/\s+/g,'');
  if (!s) return '';

  if (/^MS-?(PW|PG)/.test(s)) return 'MS';

const TESTS = [
  {k:'acid', ids:['acid'], re:/consumo de acido/, name:'Consumo de ácido'},
  {k:'pla', ids:['pla'], re:/lixi\w*bilidad|lixiviacion agitada/, name:'PLA (lixiviabilidad agitada)'},

const epItems = () => state.items.filter(it=>!it.sample && it.stages && it.stages.length);
function columnEvents(){

    [[startStage(it),'Inicio'],[endStage(it),'Descarga']].forEach(([s,kind])=>{ if (!s) return;
      colNums(it).forEach(n=>ev.push({d:day0(parse(s.at)), kind, n, cc, it, done:!!s.done, first:day0(parse(it.stages[0].at))})); });

function columnLog(){
  const cols = {};
  columnEvents().forEach(e=>{ const c = cols[e.n] ||= {n:e.n, cc:'', start:null, end:null, first:null};
    if (e.cc && (!c.cc || e.kind==='Inicio')) c.cc = e.cc;
    if (!c.first || e.first<c.first) c.first = e.first;
    if (e.kind==='Inicio'){ if (!c.start || e.d>c.start) c.start = e.d; } else if (!c.end || e.d>c.end) c.end = e.d; });

function colDays(c, y, m){
  const a = new Date(y,m,1), b = new Date(y,m+1,0);
  // Sin carga registrada: se cuenta desde el día 1 del mes en que empieza su lavado
  let s = c.start || (c.first ? new Date(c.first.getFullYear(), c.first.getMonth(), 1) : null), e = c.end;
  if (s && e && e < s) e = null;            // la descarga es de un ciclo anterior: la columna volvió a cargarse
  if (!s && !e) return 0;
  if ((s && s > b) || (e && e < a)) return 0;

/* Pruebas: se cuentan UNA vez por muestra, sin importar cuántas etapas tenga el proceso

   «Sulfataciones 29a la 36» son 8 muestras: 29, 30, 31, 32, 33, 34, 35 y 36.
   Se cobran en el mes en que TERMINA el proceso (fecha de su última etapa). */
function sampleIds(label){
  const raw = String(label||'').trim(), s = fold(raw);
  const r = s.match(/(\d+)\s*(?:a la|al|a|hasta|-|–)\s*(\d+)/);
  const pre = (raw.match(/^([A-Za-z]{1,4})[\s-]*\d/)||[])[1];   // prefijo corto como «CH 5-6» → CH 5, CH 6
  const sh = n => pre ? `${pre.toUpperCase()} ${n}` : String(n);
  if (r){ const a = +r[1], b = +r[2];
    if (b>a && b-a<=200) return Array.from({length:b-a+1}, (_,i)=>({id:String(a+i), show:sh(a+i)})); }
  const ns = s.match(/\d+/g);
  if (ns && ns.length>1 && /^[^\d]*\d+(\s*(,|y)\s*\d+)+[^\d]*$/.test(s)) return ns.map(n=>({id:String(+n), show:sh(+n)}));   // «29, 30 y 31»
  return raw ? [{id:s, show:raw}] : [];
}
const itemEnd = it => it.stages.reduce((mx,s)=>{ const d = parse(s.at); return d>mx ? d : mx; }, parse(it.stages[0].at));
function testRecords(){
  const recs = [];
  epItems().forEach(it=>{ const t = TESTS.find(t=>t.ids.includes(it.typeId)); if (!t) return;
    const start = day0(parse(it.stages[0].at)), end = day0(itemEnd(it)), cc = ccOf(it);
    sampleIds(it.label).forEach(x=>recs.push({k:t.k, cc, id:x.id, show:x.show, start, end, items:[it]})); });
  // La misma muestra en varias actividades del mismo proceso (p. ej. preparación y lavado por separado) cuenta una sola vez
  recs.sort((a,b)=>a.start-b.start);

  recs.forEach(r=>{ const key = r.k+'|'+r.cc+'|'+r.id, g = last[key];
    if (g && r.start - g.end <= 15*864e5){ if (r.end > g.end) g.end = r.end; g.items.push(...r.items); return; }
    last[key] = {...r, items:[...r.items]}; out.push(last[key]); });

}
function edpMonth(y, m){
  const nd = new Date(y,m+1,0).getDate(), inM = d => d && d.getFullYear()===y && d.getMonth()===m;
  const fin = new Date(y,m+1,0), R = {};
  CC_LIST.concat('').forEach(cc=>{ R[cc] = {full:[], part:[], days:0, ini:[], des:[], tests:{}, noStart:[], items:[], yearCols:new Set()}; TESTS.forEach(t=>R[cc].tests[t.k]=[]); });
  columnLog().forEach(c=>{ const r = R[c.cc] || R[''], dd = colDays(c,y,m);
    if (dd>=nd) r.full.push(c.n); else if (dd>0) r.part.push({n:c.n, d:dd});
    if (dd>0 && !c.start) r.noStart.push(c.n); });
  columnEvents().forEach(e=>{ const r = R[e.cc] || R[''];
    if (e.kind==='Inicio' && e.d.getFullYear()===y && e.d<=fin) r.yearCols.add(e.n);
    if (!inM(e.d)) return;
    (e.kind==='Inicio' ? r.ini : r.des).push({n:e.n, d:e.d}); if (!r.items.includes(e.it)) r.items.push(e.it); });
  testRecords().forEach(g=>{ if (!inM(g.end)) return; const r = R[g.cc] || R[''];
    r.tests[g.k].push(g.show); g.items.forEach(it=>{ if (!r.items.includes(it)) r.items.push(it); }); });
  Object.values(R).forEach(r=>{ r.full.sort((a,b)=>a-b); r.part.sort((a,b)=>a.n-b.n); r.days = r.part.reduce((s,p)=>s+p.d,0);
    r.nTests = TESTS.reduce((s,t)=>s+r.tests[t.k].length,0); r.any = r.full.length||r.part.length||r.ini.length||r.des.length||r.nTests; });
  return R;
}
function monthItems(y, m){
  const a = new Date(y,m,1), b = new Date(y,m+1,0,23,59), out = new Set();
  const opNums = new Set(columnLog().filter(c=>colDays(c,y,m)>0).map(c=>c.n));
  epItems().forEach(it=>{
    if ((startStage(it) || endStage(it)) && colNums(it).some(n=>opNums.has(n))) out.add(it);
  });
  testRecords().forEach(g=>{ if (g.end>=a && g.end<=b) g.items.forEach(it=>out.add(it)); });
  return [...out].sort((x,z)=>String(x.label).localeCompare(String(z.label),'es',{numeric:true}));
}
const partTxt = part => { const g = {}; part.forEach(p=>(g[p.d] ||= []).push(p.n));
  return Object.entries(g).sort((a,b)=>b[0]-a[0]).map(([d,ns])=>`${ns.join('-')} (${d} ${+d===1?'día':'días'})`).join(' / '); };

const toB64 = buf => { const u = new Uint8Array(buf); let s=''; for (let i=0;i<u.length;i+=8192) s += String.fromCharCode.apply(null, u.subarray(i,i+8192)); return btoa(s); };

const MES_RE = /(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(\s*)(\d{4})/i;
function ccFromBalance(title, fname){
  const t = fold(title)+' | '+fold(fname);
  if (/pipeline|_ms_pw|ms-pg|ms_pg/.test(t)) return 'MS';
  if (/caserones|esmeralda/.test(t)) return 'MS-A';
  if (/lomas bayas|maqui/.test(t)) return 'MS-B';
  if (/r&d|rd testing|_rd\b/.test(t)) return 'RD';

/* Abre la primera hoja de un balance editando el XML del archivo, para conservar formato, fórmulas e imágenes */
async function openBalance(buf){
  const zip = await window.JSZip.loadAsync(buf);
  const P = new DOMParser(), S = new XMLSerializer();
  const xml = async p => { const f = zip.file(p); if (!f) throw new Error('El archivo no es un Excel válido.'); return P.parseFromString(await f.async('string'), 'application/xml'); };
  const out = d => { const s = S.serializeToString(d); return s.startsWith('<?xml') ? s : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s; };
  const wbx = await xml('xl/workbook.xml'), rels = await xml('xl/_rels/workbook.xml.rels');
  const sh = wbx.getElementsByTagName('sheet')[0], rid = sh.getAttribute('r:id');
  const rel = [...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
  const tg = rel.getAttribute('Target'), sheetPath = tg.startsWith('/') ? tg.slice(1) : 'xl/'+tg.replace(/^\.\//,'');
  const sst = zip.file('xl/sharedStrings.xml') ? [...(await xml('xl/sharedStrings.xml')).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')) : [];
  const doc = await xml(sheetPath), NS = doc.documentElement.namespaceURI, sd = doc.getElementsByTagName('sheetData')[0];
  const rows = {}; [...sd.getElementsByTagName('row')].forEach(r=>rows[+r.getAttribute('r')] = r);
  const colIdx = ref => [...ref.match(/^[A-Z]+/)[0]].reduce((n,ch)=>n*26+ch.charCodeAt(0)-64, 0);
  const getCell = (ref, create) => {
    const rn = +ref.match(/\d+$/)[0]; let row = rows[rn];
    if (!row){ if (!create) return null; row = doc.createElementNS(NS,'row'); row.setAttribute('r', rn);
      const nx = Object.keys(rows).map(Number).filter(k=>k>rn).sort((a,b)=>a-b)[0]; sd.insertBefore(row, nx ? rows[nx] : null); rows[rn] = row; }
    let c = [...row.childNodes].find(x=>x.nodeName==='c' && x.getAttribute('r')===ref);
    if (!c && create){ c = doc.createElementNS(NS,'c'); c.setAttribute('r', ref);
      row.insertBefore(c, [...row.childNodes].find(x=>x.nodeName==='c' && colIdx(x.getAttribute('r'))>colIdx(ref)) || null); }
    return c;
  };
  const text = ref => { const c = getCell(ref); if (!c) return ''; const t = c.getAttribute('t');
    if (t==='s'){ const v = c.getElementsByTagName('v')[0]; return v ? (sst[+v.textContent]||'') : ''; }
    if (t==='inlineStr') return [...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
    const v = c.getElementsByTagName('v')[0]; return v ? v.textContent : ''; };
  const setVal = (ref, v) => { const c = getCell(ref, true); while (c.firstChild) c.removeChild(c.firstChild); c.removeAttribute('t');
    if (typeof v==='number'){ const e = doc.createElementNS(NS,'v'); e.textContent = String(v); c.appendChild(e); }
    else if (v!==''){ c.setAttribute('t','inlineStr'); const is = doc.createElementNS(NS,'is'), t = doc.createElementNS(NS,'t');
      t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve'); t.textContent = v; is.appendChild(t); c.appendChild(is); } };
  const nums = () => Object.keys(rows).map(Number).sort((a,b)=>a-b);
  return {zip, wbx, doc, sheetPath, out, getCell, text, setVal, nums};
}
/* Lee la estructura del balance: secciones, ítems, unidades y precios */
function parseTemplate(c, file){
  const cc = ccFromBalance(c.text('C3'), file);
  if (!cc) throw new Error('No reconozco su centro de costo (celda C3 «Centro de costos»).');
  const secs = [], rows = [], cant = {}; let sec = 0;
  for (const rn of c.nums()){
    const aRaw = c.text('A'+rn).trim(), a = fold(aRaw), bName = c.text('B'+rn).trim(), b = fold(bName);
    const ms = a.match(/^(\d+)\.\s/); if (ms){ sec = +ms[1]; secs.push({n:sec, title:aRaw}); continue; }
    if (a.startsWith('cantidad')){ cant[sec] = rn; continue; }
    if (!/^\d+[a-z]?$/.test(a) || !bName) continue;
    const e = c.getCell('E'+rn), ef = e && e.getElementsByTagName('f')[0], ext = !!(ef && ef.textContent.includes('!'));
    const eTxt = c.text('E'+rn), pn = Number(eTxt);
    let kind = 'manual', key = '';
    if (/operacion columnas/.test(b)){ kind = 'cal'; key = /no completo/.test(b) ? 'part' : 'full'; }
    else { const t = TESTS.find(t=>t.re.test(b)); if (t){ kind = 'cal'; key = 'test:'+t.k; } }
    rows.push({rn, sec, item:aRaw, act:bName, unit:c.text('C'+rn).trim(), frec:c.text('D'+rn).trim(),
      price: eTxt!=='' && isFinite(pn) ? pn : null, ext, kind, key, q0:+c.text('F'+rn)||0, obs0:c.text('H'+rn).trim()});
  }

}
const epMK = (y,m) => `${y}-${pad(m+1)}`;

const priceOf = row => row.ext ? null : row.price;
function epQty(tpl, row, R, mk){

    if (row.key==='full') return {q:r.full.length, obs:[r.full.length ? 'Columnas '+r.full.join('-') : '', !tpl.hasPart && r.part.length ? 'Revisar, mes no completo: '+partTxt(r.part) : ''].filter(Boolean).join(' · ')};
    if (row.key==='part') return {q:r.days, obs:r.part.length ? 'Columnas '+partTxt(r.part) : ''};
    const L = r.tests[row.key.slice(5)]; return {q:L.length, obs:L.join(' - ')};
  }
  const man = ((ep.manual[mk]||{})[tpl.cc]||{})[row.rn];
  if (man) return {q:+man.q||0, obs:man.obs||''};
  return {q: row.ext ? row.q0 : 0, obs: /^detalle/.test(fold(row.obs0)) ? row.obs0 : ''};
}
function epTotals(tpl, R, mk){
  let total = 0, pending = false; const secT = {};
  tpl.rows.forEach(row=>{ const {q} = epQty(tpl,row,R,mk);
    const p = priceOf(row);
    if (p==null){ if (q) pending = true; return; }
    const v = p*q; total += v; secT[row.sec] = (secT[row.sec]||0) + v; });
  return {total, pending, secT};

async function fillBalance(tpl, R, y, m){
  const c = await openBalance(fromB64(tpl.b64)), mk = epMK(y,m), r = R[tpl.cc];
  let tests = 0;

  });
  const hoy = new Date();
  c.setVal('E1', mesTxt(y,m));
  c.setVal('C2', `${pad(hoy.getDate())} de ${capi(MONL[hoy.getMonth()])} ${hoy.getFullYear()}`);
  // Borra los resultados guardados de las fórmulas para que Excel las recalcule al abrir
  [...c.doc.getElementsByTagName('c')].forEach(x=>{ if (x.getElementsByTagName('f').length) [...x.getElementsByTagName('v')].forEach(v=>v.remove()); });
  let cp = c.wbx.getElementsByTagName('calcPr')[0];
  if (!cp){ cp = c.wbx.createElementNS(c.wbx.documentElement.namespaceURI,'calcPr'); const ref = c.wbx.getElementsByTagName('definedNames')[0] || c.wbx.getElementsByTagName('sheets')[0]; ref.parentNode.insertBefore(cp, ref.nextSibling); }
  cp.setAttribute('fullCalcOnLoad','1');

  const name = MES_RE.test(tpl.file) ? tpl.file.replace(MES_RE, (_,mm,sp)=>`${capi(MONL[m])}${sp}${y}`) : tpl.file.replace(/\.xlsx$/i, `_${capi(MONL[m])} ${y}.xlsx`);
  return {name, blob: await c.zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression:'DEFLATE'})};
}

/* ---------- Levantamiento de columnas: inicio (I), término (T) y meses completos (X) ---------- */
function buildLevantamiento(X, y){
  const wb = X.utils.book_new(), hoy = new Date(), bd = {style:'thin', color:{rgb:'C9D1DC'}}, border = {top:bd, bottom:bd, left:bd, right:bd};

    head:{font:F({bold:true, color:{rgb:'FFFFFF'}}), fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border},
    cell:{font:F(), alignment:{horizontal:'center', vertical:'center'}, border}, left:{font:F(), alignment:{horizontal:'left', vertical:'center'}, border},
    foot:{font:F({bold:true}), fill:{fgColor:{rgb:'E7ECF3'}}, alignment:{horizontal:'center', vertical:'center'}, border},
    I:{font:F({bold:true, color:{rgb:'006100'}}), fill:{fgColor:{rgb:'C6EFCE'}}, alignment:{horizontal:'center'}, border},
    T:{font:F({bold:true, color:{rgb:'9C0006'}}), fill:{fgColor:{rgb:'FFC7CE'}}, alignment:{horizontal:'center'}, border},
    IT:{font:F({bold:true, color:{rgb:'7F6000'}}), fill:{fgColor:{rgb:'FFEB9C'}}, alignment:{horizontal:'center'}, border},
    X:{font:F({color:{rgb:'1F3864'}}), fill:{fgColor:{rgb:'DDEBF7'}}, alignment:{horizontal:'center'}, border},
  };
  const proSheet = (title, sub, headers, rows, foot, widths, styler) => {
    const n = headers.length, aoa = [[title], [sub], [], headers, ...rows, ...foot];
    const ws = X.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:n-1}}, {s:{r:1,c:0}, e:{r:1,c:n-1}}];
    for (let r=0; r<aoa.length; r++) for (let c=0; c<n; c++){
      const ref = X.utils.encode_cell({r,c}); let cell = ws[ref];
      if (r<3){ if (cell) cell.s = r===0 ? ST.title : ST.sub; continue; }
      if (!cell) cell = ws[ref] = {t:'s', v:''};
      if (r===3) cell.s = ST.head;
      else if (r >= 4+rows.length) cell.s = c===0 ? {...ST.foot, alignment:{horizontal:'left'}} : ST.foot;
      else cell.s = (styler && styler(r-4, c, cell.v)) || (typeof cell.v==='number' || c>0 ? ST.cell : ST.left);
    }
    ws['!cols'] = widths.map(w=>({wch:w}));
    ws['!rows'] = [{hpt:26}, {hpt:16}, {hpt:8}, {hpt:30}];
    ws['!autofilter'] = {ref: X.utils.encode_range({s:{r:3,c:0}, e:{r:3+rows.length, c:n-1}})};
    return ws;
  };
  const log = columnLog(), sub = `Calendario Operacional · generado el ${fmtD(hoy)} ${hm(hoy)} · I = inicio (carga) · T = término (descarga) · X = mes completo en operación`;
  const cell = (c, m) => { const d = colDays(c,y,m); if (!d) return '';
    const s = c.start && c.start.getFullYear()===y && c.start.getMonth()===m, e = c.end && c.end.getFullYear()===y && c.end.getMonth()===m && !(c.start && c.end<c.start);
    if (s && e) return `I${pad(c.start.getDate())} · T${pad(c.end.getDate())}`; if (s) return `I${pad(c.start.getDate())}`; if (e) return `T${pad(c.end.getDate())}`;
    return d >= new Date(y,m+1,0).getDate() ? 'X' : `${d} d`; };
  const cols = log.filter(c=>MONS.some((_,m)=>colDays(c,y,m)>0));
  const activa = c => colDays(c, hoy.getFullYear(), hoy.getMonth())>0 && (!c.end || c.end<c.start || day0(c.end)>=day0(hoy)) ? 'SI' : 'NO';
  const yd = c => MONS.reduce((s,_,m)=>s+colDays(c,y,m),0);
  const rows1 = cols.map(c=>[c.n, c.cc||'Sin CC', activa(c), ...MONS.map((_,m)=>cell(c,m)), yd(c), c.start ? '' : 'Sin carga registrada: se cuenta desde el día 1 del mes de su lavado']);
  const cnt = f => MONS.map((_,m)=>cols.filter(c=>f(c,m)).length);
  const foot1 = [
    ['Columnas en operación','','', ...cnt((c,m)=>colDays(c,y,m)>0), cols.length, ''],
    ['Inicios (carga)','','', ...cnt((c,m)=>c.start && c.start.getFullYear()===y && c.start.getMonth()===m), cols.filter(c=>c.start && c.start.getFullYear()===y).length, ''],
    ['Términos (descarga)','','', ...cnt((c,m)=>c.end && !(c.start && c.end<c.start) && c.end.getFullYear()===y && c.end.getMonth()===m), cols.filter(c=>c.end && c.end.getFullYear()===y).length, ''],
  ];
  const styler = (r,c,v) => { if (c===16) return {...ST.left, font:F({sz:10, italic:true, color:{rgb:'7F6000'}})}; if (c<3 || c>14 || !v) return null; const s = String(v); return s.includes('·') ? ST.IT : s[0]==='I' ? ST.I : s[0]==='T' ? ST.T : s==='X' ? ST.X : null; };
  X.utils.book_append_sheet(wb, proSheet(`Levantamiento de columnas · ${y}`, sub, ['Columna','CC','Activa hoy', ...MONS, `Días ${y}`, 'Observación'], rows1, foot1, [10,9,10, ...MONS.map(()=>11), 10, 52], styler), `COLUMNAS ${y}`);
  const ccs = CC_LIST.concat(log.some(c=>!c.cc) ? [''] : []);
  const daysCC = cc => MONS.map((_,m)=>cols.filter(c=>c.cc===cc).reduce((s,c)=>s+colDays(c,y,m),0));
  const rows2 = ccs.map(cc=>{ const d = daysCC(cc); return [cc||'Sin CC', CC_NAME[cc], ...d, d.reduce((s,x)=>s+x,0)]; });
  const foot2 = [['Total', '', ...MONS.map((_,m)=>rows2.reduce((s,r)=>s+r[m+2],0)), rows2.reduce((s,r)=>s+r[14],0)]];
  X.utils.book_append_sheet(wb, proSheet(`Días-columna por centro de costo · ${y}`, sub, ['CC','Centro de costo', ...MONS, 'Total'], rows2, foot2, [9,26, ...MONS.map(()=>9), 10]), 'DIAS POR CC');
  const rows3 = cols.map(c=>[c.n, c.cc||'Sin CC', ...MONS.map((_,m)=>colDays(c,y,m)||''), yd(c)]);
  const foot3 = [['Total', '', ...MONS.map((_,m)=>cols.reduce((s,c)=>s+colDays(c,y,m),0)), cols.reduce((s,c)=>s+yd(c),0)]];
  X.utils.book_append_sheet(wb, proSheet(`Días de operación por columna · ${y}`, sub, ['Columna','CC', ...MONS, 'Total'], rows3, foot3, [10,9, ...MONS.map(()=>8), 10]), 'DIAS POR COLUMNA');
  return wb;
}

function downloadBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }

function makeSheet(X, headers, rows, widths, dateOnly, bandCol){
