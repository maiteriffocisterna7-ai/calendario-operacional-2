  const desc = state.items.filter(i=>i.typeId==='desc').sort(sortBy(/^descarga/i)).map(i=>{ const f=i.fields||{}, d=dt(by(i,/^descarga/i));
    return [numOr(i.label), dt(by(i,/lavado/i)), dt(by(i,/drenaje/i)), d, DIA(d), dt(by(i,/sacar|pesaje/i)), f.ripio?'Sí':'No', f.feriado?fd(f.feriado):'-', f.envios||'', f.area||'', numOr(f.mineral), f.analisis||'', dt(by(i,/ingreso/i))]; });
  X.utils.book_append_sheet(wb, makeSheet(X, ['ID COLUMNA','INICIO LAVADO','INICIO DRENAJE','DESCARGA Y MUESTREO','DÍA','SACAR DEL HORNO','RIPIO ENVIADO A PROCESAMIENTO','CONSIDERACION FERIADO','Envios','Columna1','Columna2','analisis','INGRESO HORNO'], desc, [13,15,15,16,11,17,16,22,9,11,11,11,15], true, 3), 'LAVADO Y DESCARGA');
  // Resumen por día de cargas y descargas
  const days = {}; const add = (d,k,txt)=>{ if (!(d instanceof Date)) return; const key=dkey(d); (days[key] ||= {d, carga:[],riego:[],lavado:[],drenaje:[],descarga:[],horno:[],sacar:[],pend:[]})[k].push(txt); };
  state.items.filter(i=>i.typeId==='carga').forEach(i=>{ add(dt(by(i,/^carga/i)),'carga',i.label); i.stages.filter(s=>/riego/i.test(s.name)).forEach(s=>add(parse(s.at),'riego',`${i.label} (${s.name.replace(/inicio /i,'')})`)); });
  state.items.filter(i=>i.typeId==='desc').forEach(i=>{ add(dt(by(i,/lavado/i)),'lavado',i.label); add(dt(by(i,/drenaje/i)),'drenaje',i.label); add(dt(by(i,/^descarga/i)),'descarga',i.label); add(dt(by(i,/ingreso/i)),'horno',i.label);
    const sc=dt(by(i,/sacar|pesaje/i)); add(sc,'sacar',i.label); if (!(i.fields&&i.fields.ripio)) add(sc,'pend',i.label); });
  const res = Object.values(days).sort((a,b)=>a.d-b.d).map(x=>[x.d, DIA(x.d), x.carga.join(', '), x.riego.join(', '), x.lavado.join(', '), x.drenaje.join(', '), x.descarga.join(', '), x.horno.join(', '), x.sacar.join(', '), x.pend.join(', ')]);
  X.utils.book_append_sheet(wb, makeSheet(X, ['FECHA','DÍA','CARGA COLUMNAS','INICIO RIEGO','INICIO LAVADO','INICIO DRENAJE','DESCARGA Y MUESTREO','INGRESO HORNO','SACAR DEL HORNO / PESAJE','RIPIO PENDIENTE DE ENVÍO'], res, [13,11,22,24,18,18,18,18,22,22], true, 0), 'RESUMEN POR DÍA');
  const envRow = e=>[e.fecha?parse(e.fecha):'', e.cc||'', CC_NAME[e.cc]||'', numOr(e.muestra), e.horno?parse(e.horno):'', e.recep?parse(e.recep):'-', e.analisis||'', e.envProc?'Sí':'No', e.envAna?'Sí':(isNA(e.analisis)?'N/A':'No'), e.tipo||'Ripio'];
  const envH = ['Fecha envío','CC','Centro de costo','ID Muestra','Salida del horno','Fecha Recepción','Analisis','Enviado a procesamiento','Enviado a análisis','Tipo'], envW = [13,8,22,26,14,15,42,14,12,10];
  const envAll = state.envios.filter(e=>!e.del).slice().sort((a,b)=>(a.fecha||a.horno||'').localeCompare(b.fecha||b.horno||''));
  X.utils.book_append_sheet(wb, makeSheet(X, envH, envAll.filter(e=>!envDone(e)).map(envRow), envW, true, 0), 'ENVIO A PROCESAMIENTO');
  X.utils.book_append_sheet(wb, makeSheet(X, [...envH, 'Completo desde'], envAll.filter(envDone).map(e=>[...envRow(e), e.doneAt?new Date(e.doneAt):'']), [...envW, 17], true, 0), 'ENVIADOS');
  const ev = []; state.items.forEach(it=>{ const t=typeOf(it.typeId); it.stages.forEach((s,i)=>{ const d=parse(s.at); ev.push([phaseName(t,s), numOr(it.label), opOf(it,s), `${i+1}/${it.stages.length}`, s.name, d, ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()], s.done?'Hecha':'Pendiente', outOfRange(s)?'Sí':'', fieldTxt(it).join(' · '), it.notes||'']); }); });
  ev.sort((a,b)=>a[5]-b[5]);
  X.utils.book_append_sheet(wb, makeSheet(X, ['Tipo de actividad','Muestra / columna','Operador','N° etapa','Etapa','Fecha','Día','Estado','Fuera de rango (fin de semana)','Datos','Notas'], ev, [34,18,10,9,40,17,11,11,16,40,30]), 'TODAS LAS ACTIVIDADES');
  const done = state.items.filter(isDone).sort((a,b)=>(a.completedAt||'').localeCompare(b.completedAt||'')).map(it=>{ const ds=it.stages.map(s=>parse(s.at));
    return [typeOf(it.typeId).name, numOr(it.label), new Date(Math.min(...ds)), new Date(Math.max(...ds)), it.completedAt?new Date(it.completedAt):'', it.stages.map((s,i)=>`${i+1}. ${s.name} (${fmtD(parse(s.at))} ${hm(parse(s.at))})`).join(' | '), fieldTxt(it).join(' · '), it.notes||'']; });
  X.utils.book_append_sheet(wb, makeSheet(X, ['Tipo de actividad','Muestra / columna','Inicio','Término','Completada el','Etapas','Datos','Notas'], done, [34,18,17,17,17,70,40,30]), 'COMPLETADAS');
  const del = (state.deleted||[]).slice().sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||'')).map(it=>{ const ds=it.stages.map(s=>parse(s.at)), t=state.types.find(x=>x.id===it.typeId)||{fields:[]};
    const ft=(t.fields||[]).filter(f=>it.fields&&it.fields[f.key]).map(f=>`${f.label}: ${it.fields[f.key]}`).join(' · ');
    return [new Date(it.deletedAt), it.typeName||t.name||'', numOr(it.label), it.reason||'', ds.length?new Date(Math.min(...ds)):'', ds.length?new Date(Math.max(...ds)):'', it.stages.map((s,i)=>`${i+1}. ${s.name} (${fmtD(parse(s.at))} ${hm(parse(s.at))})${s.done?' ✓':''}`).join(' | '), ft, it.notes||'']; });
  X.utils.book_append_sheet(wb, makeSheet(X, ['Eliminada el','Tipo de actividad','Muestra / columna','Motivo','Inicio','Término','Etapas','Datos','Notas'], del, [17,30,18,30,17,17,70,40,30]), 'ELIMINADAS');
  const json = JSON.stringify(state), rows = [];
  for (let i=0;i<json.length;i+=30000) rows.push([json.slice(i,i+30000)]);
  const wr = makeSheet(X, ['RESPALDO DEL CALENDARIO · no modificar esta hoja · '+new Date().toLocaleString('es-CL')], rows, [120]);
  X.utils.book_append_sheet(wb, wr, 'RESPALDO');
  return wb;
}
function backupModal(){
  const X = window.XLSX;
  const last = bk.last ? new Date(bk.last) : null;
  openModal(`${head('Respaldo','Descarga un archivo con la fecha de hoy en el nombre. Guárdalo en una carpeta de respaldos; con ese mismo archivo puedes recuperar todo el calendario.')}
    <div class="bkbox">
      <b>Respaldo en Excel</b>
      <span class="hint">Hojas: CARGA COLUMNAS, LAVADO Y DESCARGA, RESUMEN POR DÍA, ENVIO A PROCESAMIENTO, TODAS LAS ACTIVIDADES, COMPLETADAS, ELIMINADAS (trazabilidad) y RESPALDO (para volver a cargar).</span>
      <div class="bar"><button class="pri" type="button" id="bXlsx" ${X?'':'disabled'}>Descargar Respaldo_calendario_operacional_${stamp()}.xlsx</button><button type="button" id="bJson">Descargar .json</button></div>
      ${X?'':'<p class="msg">No se pudo cargar el generador de Excel. Usa el respaldo .json.</p>'}
      <span class="hint">${last?`Último respaldo: ${fmtD(last)} ${hm(last)}`:'Aún no has descargado un respaldo.'} · ${state.items.length} actividades · ${(state.deleted||[]).length} eliminadas registradas · ${state.types.length} tipos</span>
    </div>
    <div class="bkbox">
      <b>Respaldo automático cada 30 segundos</b>
      <span class="hint">Mientras el calendario esté abierto, cada 30 segundos se guarda una copia si hubo cambios (se conservan las últimas ${AUTO_MAX} en este navegador). Si algo se borra o se cambia por error, restaura una copia anterior.</span>
      <div id="bAutoList"></div>
      ${window.showSaveFilePicker ? `<div class="bar"><button type="button" id="bAutoFile">${autoFile ? 'Cambiar archivo de respaldo automático' : 'Guardar también en un archivo Excel cada 30 s…'}</button></div>
      <span class="hint" id="bAutoFileMsg">${esc(autoFileMsg || (autoFile ? '' : 'Elige un archivo (por ejemplo en tu carpeta de OneDrive o Escritorio): se sobrescribe con cada cambio. Al recargar la página hay que volver a activarlo.'))}</span>` : ''}
    </div>
    <div class="bkbox">
      <b>Cargar un respaldo</b>
      <span class="hint">Elige un respaldo .xlsx o .json descargado antes (también sirve uno de la versión anterior del calendario). Reemplaza todo lo que hay ahora en este calendario.</span>
      <input type="file" id="bFile" accept=".xlsx,.json,application/json" aria-label="Archivo de respaldo">
      <p class="msg" id="bMsg" hidden></p>
      <div class="bar"><button class="pri" type="button" id="bLoad" disabled>Cargar y reemplazar</button></div>
    </div>
    <details><summary>Copiar o pegar el respaldo como texto</summary>
      <div class="fld" style="margin-top:8px"><textarea id="bOut" rows="4" readonly>${esc(JSON.stringify(state))}</textarea></div>
      <div class="bar" style="margin-top:6px"><button type="button" id="bCopy">Copiar texto</button></div>
      <div class="fld" style="margin-top:8px"><textarea id="bIn" rows="3" placeholder="Pega aquí el texto de un respaldo"></textarea></div>
      <div class="bar" style="margin-top:6px"><button type="button" id="bPaste">Cargar texto pegado</button></div>
    </details>
    <div class="mf"><button class="danger" type="button" id="bReset">Dejar en blanco</button><button type="button" data-close>Cerrar</button></div>`);
  let pending = null;
  const fail = t => { const m=$('bMsg'); m.hidden=false; m.textContent=t; };
  const apply = s => { if (!s || !Array.isArray(s.types) || !Array.isArray(s.items)) throw 0; state = s; migrate(); const nf = normalizeWeekends(); if (nf) setTimeout(()=>toast(`${nf} etapa${nf>1?'s':''} de horno/secado se corrieron al siguiente día hábil`),2800); markBackup(); closeModal(); toast(`Respaldo cargado: ${state.items.length} actividades`); };
  $('bXlsx').onclick = async ()=>{
    try { const buf = X.write(buildWorkbook(X), {bookType:'xlsx', type:'array'});
      if (await offerFile(`Respaldo_calendario_operacional_${stamp()}.xlsx`, new Blob([buf]))){ markBackup(); toast('Respaldo Excel descargado'); } }
    catch(e){ fail('No se pudo generar el Excel: '+e.message); }
  };
  const drawAuto = ()=>{
    const list = autoList().slice().reverse();
    $('bAutoList').innerHTML = list.length ? `<div class="autol">${list.map((a,k)=>{ const d = new Date(a.t);
      return `<div class="autor"><span>${fmtD(d)} ${hm(d)}:${pad(d.getSeconds())}</span><span class="hint">${a.n} actividades${k===0?' · la más reciente':''}</span><button type="button" data-autorest="${a.t}">Restaurar</button></div>`; }).join('')}</div>`
      : '<span class="hint">Todavía no hay copias automáticas (la primera se guarda a los pocos segundos de abrir el calendario).</span>';
  };
  drawAuto();
  $('bAutoList').onclick = e=>{
    const b = e.target.closest('[data-autorest]'); if (!b) return;
    const a = autoList().find(x=>x.t===b.dataset.autorest); if (!a) return;
    const d = new Date(a.t);
    if (!confirm(`¿Restaurar la copia del ${fmtD(d)} ${hm(d)}? Lo que hay ahora queda guardado como otra copia automática.`)) return;
    autoSnap(true);
    try { apply(JSON.parse(a.j)); save(); render(); } catch(err){ toast('No se pudo restaurar esa copia'); }
  };
  if ($('bAutoFile')) $('bAutoFile').onclick = async ()=>{
    try { autoFile = await window.showSaveFilePicker({suggestedName:'Respaldo_calendario_operacional_AUTOMATICO.xlsx', types:[{description:'Excel', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});
      await autoFileWrite(true); $('bAutoFile').textContent = 'Cambiar archivo de respaldo automático'; toast('Respaldo automático en archivo activado'); }
    catch(err){ if (err && err.name!=='AbortError') toast('No se pudo activar el archivo de respaldo'); }
  };
  $('bJson').onclick = async ()=>{ if (await offerFile(`Respaldo_calendario_operacional_${stamp()}.json`, JSON.stringify(state,null,1))){ markBackup(); toast('Respaldo .json descargado'); } };
  $('bFile').onchange = e=>{
    const f = e.target.files[0]; if (!f) return; $('bMsg').hidden = true; pending = null; $('bLoad').disabled = true;
    const r = new FileReader();
    if (/\.xlsx$/i.test(f.name)){
      r.onload = ()=>{ try { const wb = X.read(new Uint8Array(r.result),{type:'array'}); const ws = wb.Sheets['RESPALDO']; if (!ws) throw 0;
        const rows = X.utils.sheet_to_json(ws,{header:1}).slice(1).map(x=>x[0]||'').join(''); pending = JSON.parse(rows); $('bLoad').disabled=false; }
        catch(_){ fail('Ese Excel no tiene la hoja RESPALDO de este calendario.'); } };
      r.readAsArrayBuffer(f);
    } else { r.onload = ()=>{ try { pending = JSON.parse(r.result); $('bLoad').disabled=false; } catch(_){ fail('El archivo no es un respaldo válido.'); } }; r.readAsText(f); }
  };
  $('bLoad').onclick = ()=>{ try { apply(pending); } catch(_){ fail('El archivo no es un respaldo válido de este calendario.'); } };
  $('bCopy').onclick = ()=>{ const ta=$('bOut'); ta.select(); (navigator.clipboard?.writeText(ta.value)||Promise.reject()).then(()=>toast('Texto copiado'),()=>toast('Copia con Ctrl+C')); };
  $('bPaste').onclick = ()=>{ try { apply(JSON.parse($('bIn').value)); } catch(_){ fail('El texto no es un respaldo válido. Revisa que lo copiaste completo.'); } };
  $('bReset').onclick = e=>{ const b=e.currentTarget; if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='Confirmar: borrar todo'; return; } const keep=(state.deleted||[]).slice(); state.items.forEach(it=>{ if(!it.sample) keep.push({...it, did:uid(), typeName:typeOf(it.typeId).name, deletedAt:new Date().toISOString(), reason:'Calendario dejado en blanco'}); }); state=sampleState(); state.deleted=keep; closeModal(); toast('Calendario en blanco; lo anterior queda en ELIMINADAS del respaldo'); };
}

/* ---------- Eventos globales ---------- */
document.addEventListener('click', e=>{
  const pr = e.target.closest('[data-print]'); if (pr){ printDay(pr.dataset.print); return; }
  const eck = e.target.closest('[data-eck]');
  if (eck){
    const [id,f] = eck.dataset.eck.split('|'), en = state.envios.find(x=>x.id===id); if (!en) return;
    const was = envDone(en); en[f] = !en[f];
    /* Al marcar «Env. proc.» la fecha de envío pasa a ser siempre la de hoy (el día en que se marcó); al desmarcarlo vuelve la que tenía antes */
    if (f==='envProc'){
      if (en.envProc){ en.fechaPrev = en.fecha || ''; en.fecha = dkey(new Date()); en.fechaAuto = 1; if (en.from) en.edF = 1; }
      else if (en.fechaAuto){ en.fecha = en.fechaPrev || ''; delete en.fechaAuto; delete en.fechaPrev; }
    }
    render();
    const now = envDone(en);
    toast(`${en.muestra||'Envío'}: ${en[f]?'enviado':'no enviado'} a ${f==='envProc'?'procesamiento':'análisis'}${en[f]?' ✓':''}${now && !was ? ' · pasa al historial' : !now && was ? ' · vuelve a pendientes' : ''}`); return;
  }
  const del = e.target.closest('[data-edel]');
  if (del){
    if (!del.classList.contains('arm')){ del.classList.add('arm'); del.textContent='¿Quitar?'; return; }
    const en = state.envios.find(x=>x.id===del.dataset.edel); if (!en) return;
    if (en.from) en.del = true; else state.envios = state.envios.filter(x=>x!==en);
    render(); toast(`${en.muestra||'Envío'} quitado de la lista`); return;
  }
  const b = e.target.closest('[data-ck],[data-close],[data-openday],[data-open],.chip,[data-toggle]');
  if (!b) return;
  if (b.matches('[data-ck]')){
    const [id,i] = b.dataset.ck.split('|'), it = itemOf(id); if (!it || !it.stages[+i]) return;
    const s = it.stages[+i]; setDone(s, !s.done); if (it.sample) delete it.sample; syncDone(it); render();
    toast(isDone(it) ? `${typeOf(it.typeId).name} · ${it.label}: completada` : `${s.name}: ${s.done?'hecha ✓':'pendiente'}`);
    return;
  }
  if (b.matches('[data-close]')) return closeModal();
  if (b.matches('.chip')) return itemModal(b.dataset.item);
  if (b.matches('[data-openday]')) return dayModal(b.dataset.openday);
  if (b.matches('[data-toggle]')){ const id=b.dataset.toggle; ui.hidden.has(id)?ui.hidden.delete(id):ui.hidden.add(id); saveUi(); return render(); }
  if (b.matches('[data-open]') && !e.target.matches('input') && !e.target.closest('.opk')) return itemModal(b.dataset.open);
});
document.addEventListener('keydown', e=>{ const t=e.target.closest?.('[data-toggle],.chip .cb'); if (t && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); t.click(); }});
/* Envíos: lo que se escribe se guarda al instante (sin esperar a salir del campo) */
document.addEventListener('input', e=>{ const x=e.target; if (!x.dataset || !x.dataset.ef || x.tagName==='SELECT') return;
  const row = x.closest('[data-env]'); const en = row && state.envios.find(v=>v.id===row.dataset.env); if (!en) return;
  en[x.dataset.ef] = x.value; if (en.from && x.dataset.ef==='muestra') en.edM=1; save(); });
document.addEventListener('change', e=>{ const x=e.target;
  if (x.dataset.ef){ const en = state.envios.find(v=>v.id===x.closest('[data-env]').dataset.env); if (!en) return; const k = x.dataset.ef;
    en[k] = x.value; if (k==='fecha') delete en.fechaAuto; if (en.from){ if (k==='fecha') en.edF=1; if (k==='muestra') en.edM=1; if (k==='cc') en.edC=1; }
    if (k==='analisis'){ if (x.value && x.value!==anAuto(en)) en.edA=1; else delete en.edA; }   // vacío o el de su CC = automático
    if (k==='analisis' || k==='cc'){ const was = !!en.doneAt; syncEnvios(); render(); if (!was && en.doneAt) toast(`${en.muestra||'Envío'}: completo, pasa al historial`); return; }
    if (k==='fecha') render(); else save(); return; }
  const ag = x.closest && x.closest('[data-agop]');
  if (ag){ const [id,i]=ag.dataset.agop.split('|'); const it=itemOf(id); if (!it) return; const s=it.stages[+i], v=opRead(ag);
    if (v) s.op=v; else delete s.op; if (it.sample) delete it.sample; save(); toast(`${s.name}: ${v || (it.op ? 'responsables '+it.op : 'sin operador')}`); return; }
  if (x.dataset.done){ const [id,i]=x.dataset.done.split('|'); const it=itemOf(id); setDone(it.stages[+i], x.checked); syncDone(it); render(); if (isDone(it)) toast(`${typeOf(it.typeId).name} · ${it.label}: completada`); }});
$('prev').onclick = ()=>{ ui.m--; if(ui.m<0){ui.m=11;ui.y--;} render(); };
$('next').onclick = ()=>{ ui.m++; if(ui.m>11){ui.m=0;ui.y++;} render(); };
$('btnMore').onclick = ()=>{ const m = $('more'), o = m.hidden; m.hidden = !o; $('btnMore').setAttribute('aria-expanded', o); $('btnMore').textContent = o ? 'Menos opciones ▴' : 'Más opciones ▾'; };
if ($('today')) $('today').onclick =()=>{ const n=new Date(); ui.y=n.getFullYear(); ui.m=n.getMonth(); render(); };
$('vMonth').onclick = ()=>{ ui.view='month'; render(); };
$('vAgenda').onclick = ()=>{ ui.view='agenda'; render(); };
$('vDone').onclick = ()=>{ ui.view='done'; render(); };
$('vEnv').onclick = ()=>{ ui.view='envios'; render(); };
$('vEp').onclick = ()=>{ ui.view='ep'; render(); };
$('fOp').onchange = e=>{ ui.op = e.target.value; render(); };
$('pDay').value = dkey(new Date());
$('pBtn').onclick = ()=>{ const v = $('pDay').value; if (v) printDay(v); else toast('Elige el día que quieres imprimir'); };
$('q').oninput = e=>{ ui.q=e.target.value.trim().toLowerCase(); render(); };
$('btnNew').onclick = ()=>newModal();
$('btnTypes').onclick = typesModal;
$('btnOps').onclick = opsModal;
$('btnBackup').onclick = backupModal;
$('bkStatus').onclick = backupModal;
$('btnClearSamples').onclick = ()=>{ state.items = state.items.filter(i=>!i.sample); render(); toast('Ejemplos borrados'); };

render();
if (fixedOnLoad) toast(`${fixedOnLoad} etapa${fixedOnLoad>1?'s':''} de horno/secado estaba${fixedOnLoad>1?'n':''} en fin de semana y se corri${fixedOnLoad>1?'eron':'ó'} al siguiente día hábil`);
})();
